<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orcie</title>
<style>
:root{--bg:#fff;--side:#3f0e40;--side-fg:#cfc3cf;--side-hi:#1164a3;--fg:#1d1c1d;--mute:#6b6b6b;--line:#e3e3e3;--card:#f8f8f8;--accent:#4a154b;--sys:#8a6d00}
@media (prefers-color-scheme:dark){:root{--bg:#1a1d21;--side:#19171d;--side-fg:#b9b3bd;--fg:#e8e8e8;--mute:#9a9a9a;--line:#2f3237;--card:#222529;--accent:#9a6bb0;--sys:#d9b34a}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:15px/1.45 -apple-system,system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--fg);display:flex}
aside{width:260px;background:var(--side);color:var(--side-fg);display:flex;flex-direction:column;overflow:auto;flex-shrink:0}
aside h1{font-size:18px;margin:0;padding:14px 16px;color:#fff}
aside h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin:14px 16px 4px;display:flex;justify-content:space-between;align-items:center}
aside h2 button{background:none;border:0;color:inherit;font-size:18px;cursor:pointer;padding:0 4px}
.item{padding:4px 16px;cursor:pointer;display:flex;gap:8px;align-items:center;border-radius:6px;margin:0 8px}
.item:hover{background:rgba(255,255,255,.08)}.item.on{background:var(--side-hi);color:#fff}
.dot{width:8px;height:8px;border-radius:50%;background:#2bac76;flex-shrink:0}
main{flex:1;display:flex;flex-direction:column;min-width:0}
header{padding:12px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header b{font-size:16px}header .mem{color:var(--mute);font-size:13px}
header select,header button{font:inherit;padding:3px 8px}
#msgs{flex:1;overflow:auto;padding:16px 20px}
.msg{display:flex;gap:10px;margin-bottom:14px}
.av{width:34px;height:34px;border-radius:6px;display:grid;place-items:center;color:#fff;font-weight:600;flex-shrink:0}
.who{font-weight:700}.when{color:var(--mute);font-size:12px;margin-left:6px}
.body{white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
.body code{background:var(--card);padding:1px 4px;border-radius:4px}
.body pre{background:var(--card);padding:8px;border-radius:6px;overflow:auto;white-space:pre}
.sys{color:var(--sys);font-size:13px;text-align:center;margin:8px 0}
#typing{padding:0 20px;color:var(--mute);font-size:13px;max-height:40vh;overflow:auto}
details.act{margin:4px 0;color:var(--mute);font-size:13px}
details.act summary{cursor:pointer;user-select:none}
.tool{font-family:ui-monospace,Menlo,monospace;font-size:12px;margin:4px 0 4px 14px;padding:4px 8px;background:var(--card);border-radius:6px;color:var(--fg)}
.tool .nm{font-weight:700;color:var(--accent)}.tool .in{white-space:pre-wrap;overflow-wrap:anywhere}
.tool .res{color:var(--mute);white-space:pre-wrap;overflow-wrap:anywhere;margin-top:3px;max-height:120px;overflow:auto}.tool .res.bad{color:#d33}
.tool.run .nm::after{content:" …"}
form{padding:0 20px 18px;display:flex;gap:8px}
textarea{flex:1;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);resize:none;height:48px}
button.send{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:0 18px;font:inherit;cursor:pointer}
button:disabled,textarea:disabled{opacity:.5}
.empty{margin:auto;color:var(--mute);text-align:center;padding:40px}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);min-width:320px}
dialog label{display:block;margin:10px 0 4px;font-size:13px;color:var(--mute)}
dialog input[type=text],dialog select{width:100%;font:inherit;padding:6px}
dialog .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.chk{display:flex;gap:6px;align-items:center;margin:2px 0}
@media (max-width:640px){aside{width:200px}}
</style>
</head>
<body>
<aside>
  <h1>🐳 Orcie</h1>
  <h2>Rooms <button id="newRoom" title="New room">+</button></h2><div id="rooms"></div>
  <h2>Agents <button id="newAgent" title="Hire an agent">+</button></h2><div id="agents"></div>
  <h2>Agent DMs</h2><div id="aadms"></div>
</aside>
<main>
  <header id="hdr"><b>Welcome</b></header>
  <div id="msgs"><div class="empty">Hire an agent (+) to start a conversation, or create a room.</div></div>
  <div id="typing"></div>
  <form id="form"><textarea id="txt" placeholder="Message… (Enter to send, Shift+Enter for newline, @name to address one agent)" disabled></textarea><button class="send" disabled>Send</button></form>
</main>

<dialog id="agentDlg"><form method="dialog" id="agentForm">
  <b>Hire an agent</b>
  <label>Name</label><input type="text" id="aName" placeholder="e.g. alice" pattern="[a-z][a-z0-9\-]{0,30}" required>
  <label>Model</label><select id="aModel"><option value="claude-sonnet-5-5">Sonnet 5.5</option><option value="claude-opus-5-5">Opus 5.5</option><option value="claude-haiku-5-5">Haiku 5.5</option></select>
  <div class="row"><button value="cancel" type="button" onclick="agentDlg.close()">Cancel</button><button class="send" id="aGo">Create</button></div>
</form></dialog>

<dialog id="roomDlg"><form method="dialog" id="roomForm">
  <b>New room</b>
  <label>Title</label><input type="text" id="rTitle" placeholder="e.g. design" required>
  <label>Members</label><div id="rMembers"></div>
  <div class="row"><button value="cancel" type="button" onclick="roomDlg.close()">Cancel</button><button class="send">Create</button></div>
</form></dialog>

<script>
const $ = (id) => document.getElementById(id);
let state = { agents: [], conversations: [] }, cur = null, conv = null, typing = {}, live = {}; // live[conv][agent] = tool items for the turn in progress
const colors = ["#e01e5a","#2eb67d","#ecb22e","#36c5f0","#7c3aed","#e8912d","#0b7285","#a61e4d"];
const color = (n) => n === "user" ? "#555" : colors[[...n].reduce((a, c) => a + c.charCodeAt(0), 0) % colors.length];
const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const fmt = (s) => esc(s).replace(/```([\s\S]*?)```/g, "<pre>$1</pre>").replace(/`([^`\n]+)`/g, "<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
const api = async (path, method = "GET", body) => {
  const r = await fetch("/api" + path, { method, headers: { "content-type": "application/json" }, body: body && JSON.stringify(body) });
  const j = await r.json(); if (!r.ok) throw new Error(j.error || r.statusText); return j;
};

async function refresh() {
  state = await api("/state");
  const side = (el, items, label) => { el.innerHTML = ""; items.forEach(([id, text, dot]) => {
    const d = document.createElement("div"); d.className = "item" + (id === cur ? " on" : "");
    d.innerHTML = (dot ? '<span class="dot"></span>' : "") + esc(text); d.onclick = () => open(id); el.append(d); }); };
  side($("rooms"), state.conversations.filter((c) => c.kind === "room").map((c) => [c.id, "# " + c.title]));
  side($("agents"), state.agents.map((a) => ["dm:" + a.name, a.name, true]));
  side($("aadms"), state.conversations.filter((c) => c.id.includes("+")).map((c) => [c.id, c.title]));
}

async function open(id) {
  cur = id; conv = await api("/conversations/" + encodeURIComponent(id));
  const ro = id.includes("+");
  $("txt").disabled = ro; document.querySelector("button.send").disabled = ro;
  const h = $("hdr"); h.innerHTML = "";
  const t = document.createElement("b"); t.textContent = conv.kind === "room" ? "# " + conv.title : conv.title; h.append(t);
  const m = document.createElement("span"); m.className = "mem"; m.textContent = conv.kind === "room" ? "members: " + (conv.members.join(", ") || "none yet") : (ro ? "read-only: agents talking to each other" : "direct message"); h.append(m);
  if (conv.kind === "room") {
    const avail = state.agents.filter((a) => !conv.members.includes(a.name));
    if (avail.length) { const s = document.createElement("select"); s.innerHTML = "<option value=''>+ add agent…</option>" + avail.map((a) => `<option>${a.name}</option>`).join("");
      s.onchange = async () => { if (s.value) { await api(`/rooms/${encodeURIComponent(id)}/members`, "POST", { name: s.value }); await refresh(); open(id); } }; h.append(s); }
  }
  render(); refresh(); if (!ro) $("txt").focus();
}

function render() {
  const box = $("msgs"); box.innerHTML = "";
  if (!conv.messages.length) box.innerHTML = '<div class="empty">No messages yet. Say hello!</div>';
  conv.messages.forEach(addMsg);
  box.scrollTop = box.scrollHeight; drawTyping();
}
function addMsg(m) {
  const box = $("msgs"); if (box.querySelector(".empty")) box.innerHTML = "";
  const d = document.createElement("div");
  if (m.from === "system") { d.className = "sys"; d.textContent = m.text; }
  else { d.className = "msg"; d.innerHTML = `<div class="av" style="background:${color(m.from)}">${esc(m.from[0].toUpperCase())}</div><div><span class="who">${esc(m.from)}</span><span class="when">${new Date(m.at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}</span><div class="body">${fmt(m.text)}</div></div>`;
    if (m.activity?.length) d.lastChild.append(actEl(m.activity, `used ${m.activity.length} tool${m.activity.length > 1 ? "s" : ""}`, false)); }
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  box.append(d); if (atBottom) box.scrollTop = box.scrollHeight;
}
function toolEl(it) {
  const t = document.createElement("div"); t.className = "tool" + (it.result === undefined ? " run" : ""); t.dataset.id = it.id;
  t.innerHTML = `<span class="nm">${esc(it.name)}</span> <span class="in">${esc(it.input)}</span>` + (it.result !== undefined ? `<div class="res${it.ok === false ? " bad" : ""}">${esc(it.result)}</div>` : "");
  return t;
}
function actEl(items, label, open) {
  const d = document.createElement("details"); d.className = "act"; d.open = open;
  const s = document.createElement("summary"); s.textContent = label; d.append(s); items.forEach((it) => d.append(toolEl(it))); return d;
}
function drawTyping() {
  const box = $("typing"), open = {};
  box.querySelectorAll("details[data-agent]").forEach((d) => (open[d.dataset.agent] = d.open));
  box.innerHTML = "";
  for (const a of Object.keys(typing[cur] || {}).filter((a) => typing[cur][a])) {
    const items = live[cur]?.[a] || [];
    const d = actEl(items, `${a} is thinking…` + (items.length ? ` (${items.length} tool${items.length > 1 ? "s" : ""} — click to expand)` : ""), open[a] ?? false);
    d.dataset.agent = a; box.append(d);
  }
}

$("form").onsubmit = async (e) => {
  e.preventDefault(); const text = $("txt").value.trim(); if (!text || !cur) return; $("txt").value = "";
  try { await api(`/conversations/${encodeURIComponent(cur)}/messages`, "POST", { text }); } catch (err) { alert(err.message); }
};
$("txt").onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); } };

$("newAgent").onclick = () => { $("aName").value = ""; agentDlg.showModal(); };
$("agentForm").onsubmit = async (e) => {
  e.preventDefault(); const go = $("aGo"); go.disabled = true; go.textContent = "Starting container…";
  try { await fetch("/agents", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ name: $("aName").value.trim(), model: $("aModel").value }) }).then(async (r) => { if (!r.ok) throw new Error((await r.json()).error); });
    agentDlg.close(); await refresh(); open("dm:" + $("aName").value.trim()); } catch (err) { alert(err.message); }
  go.disabled = false; go.textContent = "Create";
};
$("newRoom").onclick = () => {
  $("rTitle").value = ""; $("rMembers").innerHTML = state.agents.map((a) => `<label class="chk"><input type="checkbox" value="${a.name}" checked> ${a.name}</label>`).join("") || "<i>no agents yet</i>";
  roomDlg.showModal();
};
$("roomForm").onsubmit = async (e) => {
  e.preventDefault();
  try { const r = await api("/rooms", "POST", { title: $("rTitle").value, members: [...document.querySelectorAll("#rMembers input:checked")].map((i) => i.value) });
    roomDlg.close(); await refresh(); open(r.id); } catch (err) { alert(err.message); }
};

const es = new EventSource("/api/events");
es.onmessage = (ev) => {
  const e = JSON.parse(ev.data);
  if (e.type === "state") refresh();
  if (e.type === "message") { if (e.conv === cur) { conv.messages.push(e.msg); addMsg(e.msg); } refresh(); }
  if (e.type === "typing") { (typing[e.conv] ??= {})[e.agent] = e.on; if (e.on) (live[e.conv] ??= {})[e.agent] = []; if (e.conv === cur) drawTyping(); }
  if (e.type === "activity") {
    const items = ((live[e.conv] ??= {})[e.agent] ??= []);
    if (e.item) items.push(e.item);
    else { const it = items.find((x) => x.id === e.update.id); if (it) Object.assign(it, e.update); }
    if (e.conv === cur) drawTyping();
  }
};
refresh();
</script>
</body>
</html>
